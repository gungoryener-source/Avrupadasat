name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gizli anahtar taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Lint · Tip · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avrupadasat
          POSTGRES_PASSWORD: avrupadasat
          POSTGRES_DB: avrupadasat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avrupadasat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://avrupadasat:avrupadasat@localhost:5432/avrupadasat?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test gizli anahtarları (her çalışmada rastgele)
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: pnpm format:check
      - run: pnpm db:generate
      - run: pnpm --filter @avrupadasat/db migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      # Tenant izolasyon testleri dahil (DATABASE_URL tanımlı olduğu için atlanmaz)
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: Uçtan uca (tarayıcı)
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avrupadasat
          POSTGRES_PASSWORD: avrupadasat
          POSTGRES_DB: avrupadasat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avrupadasat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://avrupadasat:avrupadasat@localhost:5432/avrupadasat?schema=public
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      # Yalnız CI için üretilen test değerleri
      GTM_ID: GTM-TEST123
      META_PIXEL_ID: "1234567890"
      E2E_BASE: http://localhost:3100
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test gizli anahtarları
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - run: pnpm --filter @avrupadasat/db migrate:deploy
      - run: pnpm --filter @avrupadasat/web build
      - name: Sunucuyu başlat
        run: |
          pnpm --filter @avrupadasat/web exec next start -p 3100 &
          npx wait-on -t 60000 http://localhost:3100/api/health
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-ekran-goruntuleri
          path: /tmp/e2e/*.png

  images:
    name: Kapsayıcı imajları (web · worker · migrate)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Derle (yayınlamadan)
        run: |
          for t in web worker migrate; do
            docker buildx build --target "$t" -t "avrupadasat-$t:ci" --load .
          done
      - name: Web imajı ayağa kalkıyor mu
        run: |
          docker run -d --name web -p 3000:3000 \
            -e DATABASE_URL=postgresql://x:x@127.0.0.1:1/x \
            -e AUTH_SECRET="$(openssl rand -base64 48)" \
            -e FIELD_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e NEXT_PUBLIC_SITE_URL=http://localhost:3000 avrupadasat-web:ci
          npx wait-on -t 60000 http://localhost:3000/api/health
          docker exec web id -u | grep -vx 0   # root olarak çalışmamalı
